services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentdock-postgres
    environment:
      POSTGRES_USER: agentdock
      POSTGRES_PASSWORD: agentdock
      POSTGRES_DB: agentdock
    ports:
      - "5432:5432"
    volumes:
      - agentdock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdock -d agentdock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentdock-postgres-data:
